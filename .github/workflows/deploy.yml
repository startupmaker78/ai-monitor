name: Deploy to Yandex Cloud (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  YC_FOLDER_ID: b1gldbqt279ed94nrnpt
  YC_REGISTRY_ID: crps6cjjiemm3isfdt50
  YC_RUNTIME_SA_ID: aje8vk01bgb0ij6rfgan
  YC_CONTAINER_NAME: webmonitor-staging
  YC_LOCKBOX_SECRET_ID: e6q7u31vmglihgr4658s
  # Запиннутая версия Lockbox. При добавлении/ротации секрета — залить новую
  # версию и обновить ЭТОТ id (гейт «секреты в пине» ниже валит билд, если
  # ключа из SECRET_KEYS нет в этой версии — не даёт секрету молча отстать).
  YC_LOCKBOX_VERSION_ID: e6q0og2iju2601t56ml2
  # Единый список ключей секретов — источник правды и для гейта наличия, и для
  # деплой-шага (не дублируем, не разъезжаемся).
  SECRET_KEYS: >-
    DATABASE_URL AUTH_SECRET AUTH_URL YOS_BUCKET_NAME YOS_ENDPOINT YOS_REGION
    YOS_ACCESS_KEY_ID YOS_SECRET_ACCESS_KEY YOS_PUBLIC_URL ANTHROPIC_API_KEY
    OPENROUTER_API_KEY METRIKA_CLIENT_ID METRIKA_CLIENT_SECRET YOOKASSA_SHOP_ID
    YOOKASSA_SECRET_KEY RESEND_API_KEY IP_HASH_SALT CRON_SECRET DEMO_USER_ID
    MIN_SESSIONS_BUDGET AI_API_URL AI_PROXY_AUTH
  IMAGE_REPO: webmonitor

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and configure yc CLI
        env:
          SA_KEY: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yc -n
          echo "$HOME/yc/bin" >> $GITHUB_PATH
          export PATH="$HOME/yc/bin:$PATH"
          KEY_FILE=$(mktemp)
          trap "rm -f $KEY_FILE" EXIT
          printf '%s' "$SA_KEY" > "$KEY_FILE"
          yc config profile create sa-profile
          yc config set service-account-key "$KEY_FILE"
          yc config set folder-id ${{ env.YC_FOLDER_ID }}

      # ГЕЙТ 1: все миграции применены на staging-БД. Read-only (psql читает
      # _prisma_migrations, ничего не пишет). Без npm ci — psql предустановлен
      # на ubuntu-latest, гейт лёгкий. Ловит «забыл накатить миграцию»: код не
      # уедет впереди схемы, узнаем в CI, а не от клиента на дашборде.
      # DATABASE_URL берём из Lockbox и маскируем — в лог не попадает.
      - name: Гейт — все миграции применены
        run: |
          export PATH="$HOME/yc/bin:$PATH"
          DB_URL=$(yc lockbox payload get --id ${{ env.YC_LOCKBOX_SECRET_ID }} --key DATABASE_URL)
          echo "::add-mask::$DB_URL"
          mkdir -p "$HOME/.postgresql"
          cp scripts/yandex-root.crt "$HOME/.postgresql/root.crt"
          export PGSSLMODE=verify-full
          export PGSSLROOTCERT="$HOME/.postgresql/root.crt"
          APPLIED=$(psql "$DB_URL" -tAc \
            "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          PENDING=""
          for d in prisma/migrations/*/; do
            name=$(basename "$d")
            echo "$APPLIED" | grep -qxF "$name" || PENDING="$PENDING $name"
          done
          if [ -n "$PENDING" ]; then
            echo "::error title=Неприменённые миграции::На staging-БД НЕ накатаны миграции:$PENDING. Деплой остановлен — код уехал бы впереди схемы. Накатите вручную: npm run prisma migrate deploy (см. docs/DEPLOY_SETUP.md), затем перезапустите деплой."
            exit 1
          fi
          echo "✅ Все миграции применены."

      # ГЕЙТ 2: каждый ключ из SECRET_KEYS присутствует в ЗАПИННУТОЙ версии
      # Lockbox. Добавили секрет, но забыли залить новую версию / бампнуть
      # YC_LOCKBOX_VERSION_ID → красный билд (иначе секрет молча отстал бы —
      # почти наступили с DEMO_USER_ID). Значения не печатаем (>/dev/null).
      - name: Гейт — все секреты есть в запиннутой версии Lockbox
        run: |
          export PATH="$HOME/yc/bin:$PATH"
          # Один вызов + jq извлекает ТОЛЬКО ключи (значения в лог не попадают,
          # jq их не выводит). Надёжнее 22 отдельных вызовов (нет пер-ключевого
          # транзиента), и быстрее.
          PRESENT=$(yc lockbox payload get --id ${{ env.YC_LOCKBOX_SECRET_ID }} \
            --version-id ${{ env.YC_LOCKBOX_VERSION_ID }} --format json | jq -r '.entries[].key')
          # Пустой ответ = Lockbox/сеть недоступны, а НЕ «все секреты пропали».
          # Различаем явно, чтобы не выдать обманчивое «нет 22 ключей» на блипе.
          if [ -z "$PRESENT" ]; then
            echo "::error title=Lockbox недоступен::Не удалось прочитать версию ${{ env.YC_LOCKBOX_VERSION_ID }} секрета ${{ env.YC_LOCKBOX_SECRET_ID }} (пустой ответ). Это инфра-проблема (сеть/права/rate-limit), а не пропавшие секреты. Перезапустите деплой."
            exit 1
          fi
          MISSING=""
          for k in ${{ env.SECRET_KEYS }}; do
            echo "$PRESENT" | grep -qxF "$k" || MISSING="$MISSING $k"
          done
          if [ -n "$MISSING" ]; then
            echo "::error title=Секрет не в пине::В версии Lockbox ${{ env.YC_LOCKBOX_VERSION_ID }} нет ключей:$MISSING. Залейте их в Lockbox и обновите YC_LOCKBOX_VERSION_ID в deploy.yml — иначе секрет молча не подхватится."
            exit 1
          fi
          echo "✅ Все ${{ env.SECRET_KEYS }} присутствуют в пине."

      - name: Configure Docker auth via yc CLI
        run: yc container registry configure-docker

      # Retry вокруг uses:-шагов (nick-fields/retry умеет только shell). Флейк
      # был именно тут: setup-buildx тянет moby/buildkit из Docker Hub и ловил
      # «connection reset». Зеркало base-образа в YC Registry — если повторится.
      - name: Set up Docker Buildx (retry)
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/setup-buildx-action@v3
          attempt_limit: 3
          attempt_delay: 10000

      - name: Build and push Docker image (retry)
        uses: Wandalen/wretry.action@v3.8.0
        with:
          action: docker/build-push-action@v6
          attempt_limit: 3
          attempt_delay: 15000
          # tags через запятую (не многострочный |) — with передаётся строкой.
          #
          # provenance/sbom отключены 12.08.2026 ВРЕМЕННО. Причина: YC Container
          # Registry перестал принимать OCI-индекс, содержащий attestation-манифест
          # («unknown: Cannot read manifest data ... consistent with the requirements
          # from .../manifest-v2-2/»). Слои заливались успешно, отказ приходил на
          # пуше манифест-листа; 9 попыток в 3 прогонах. УТРОМ ТОГО ЖЕ ДНЯ тот же
          # конфиг с тем же attestation прошёл (тег 8baa2111…), между сборками CI
          # не менялся — правились только markdown-файлы. Отключение убирает
          # attestation из индекса, и на выходе получается обычный манифест v2.2,
          # которого и требует текст ошибки. sbom гасим заодно: по логам он и так
          # был выключен (один attestation на сборку), но явный false исключает
          # зависимость от дефолтов версии действия.
          # ВЕРНУТЬ, когда поддержка YC ответит или починит приём индексов.
          with: |
            context: .
            file: ./Dockerfile
            push: true
            platforms: linux/amd64
            provenance: false
            sbom: false
            tags: cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_REPO }}:${{ github.sha }},cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_REPO }}:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max

      - name: Deploy Serverless Container revision via yc CLI
        run: |
          SECRET_ARGS=""
          for k in ${{ env.SECRET_KEYS }}; do
            SECRET_ARGS="$SECRET_ARGS --secret id=${{ env.YC_LOCKBOX_SECRET_ID }},version-id=${{ env.YC_LOCKBOX_VERSION_ID }},key=$k,environment-variable=$k"
          done

          eval yc serverless container revision deploy \
            --container-name ${{ env.YC_CONTAINER_NAME }} \
            --image cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_REPO }}:${{ github.sha }} \
            --cores 1 \
            --memory 512MB \
            --core-fraction 100 \
            --concurrency 8 \
            --execution-timeout 600s \
            --service-account-id ${{ env.YC_RUNTIME_SA_ID }} \
            $SECRET_ARGS

      - name: Smoke test deployed container
        run: |
          CONTAINER_URL="https://bbarn8gnskqll4cjnkhm.containers.yandexcloud.net"

          echo "=== Health check (liveness) ==="
          sleep 10
          curl -fsS -o /tmp/health.json -w "Status: %{http_code}\n" \
            "$CONTAINER_URL/api/health" || (echo "HEALTH FAILED"; cat /tmp/health.json; exit 1)
          cat /tmp/health.json

          echo ""
          echo "=== Health check (deep — контейнер→БД) ==="
          # ?deep=1 пингует БД (SELECT 1). Ловит «контейнер не достаёт БД»
          # (SSL-cert/секрет/сеть) на пути контейнер→БД — иное, чем гейт
          # миграций из раннера. Всегда 200 → проверяем "db":"ok" в теле.
          curl -fsS -o /tmp/health-deep.json "$CONTAINER_URL/api/health?deep=1" \
            || (echo "HEALTH DEEP FAILED"; exit 1)
          cat /tmp/health-deep.json
          if ! grep -q '"db":"ok"' /tmp/health-deep.json; then
            echo "DB CHECK FAILED — контейнер не достучался до БД (см. тело выше)"
            exit 1
          fi
          echo "DB reachable from container: OK"

          echo ""
          echo "=== Landing / ==="
          curl -fsS -o /dev/null -w "Status: %{http_code}\n" "$CONTAINER_URL/" \
            || (echo "LANDING FAILED"; exit 1)

          echo ""
          echo "=== /login ==="
          curl -fsS -o /dev/null -w "Status: %{http_code}\n" "$CONTAINER_URL/login" \
            || (echo "LOGIN FAILED"; exit 1)

          echo ""
          echo "=== /signup ==="
          curl -fsS -o /dev/null -w "Status: %{http_code}\n" "$CONTAINER_URL/signup" \
            || (echo "SIGNUP FAILED"; exit 1)

          echo ""
          echo "=== /tracker.js ==="
          TRACKER_RESPONSE=$(curl -fsS -D /tmp/tracker-headers.txt \
            "$CONTAINER_URL/tracker.js" -o /tmp/tracker.js \
            -w "STATUS=%{http_code} SIZE=%{size_download}")
          echo "$TRACKER_RESPONSE"

          STATUS=$(echo "$TRACKER_RESPONSE" | grep -oP 'STATUS=\K\d+')
          SIZE=$(echo "$TRACKER_RESPONSE" | grep -oP 'SIZE=\K\d+')

          if [ "$STATUS" != "200" ]; then
            echo "TRACKER FAILED — expected 200, got $STATUS"
            exit 1
          fi

          # Размер должен быть в районе 180 KB (179.5-180.5 KB).
          # Меньше 100 KB — значит build:tracker не отработал, отдан
          # placeholder или html-404. Больше 250 KB — забыли --prod (отдан
          # неминифицированный, ~400 KB).
          if [ "$SIZE" -lt 100000 ] || [ "$SIZE" -gt 250000 ]; then
            echo "TRACKER size suspicious: $SIZE bytes (expected ~180000)"
            exit 1
          fi

          # Проверим Content-Type — должен быть application/javascript или
          # text/javascript (Next.js по умолчанию выставляет правильный).
          CT=$(grep -i '^content-type:' /tmp/tracker-headers.txt | head -1)
          if ! echo "$CT" | grep -qiE 'javascript'; then
            echo "TRACKER wrong content-type: $CT"
            exit 1
          fi

          # Проверим что это IIFE с нашим banner-комментарием.
          if ! head -1 /tmp/tracker.js | grep -q 'Webmonitor tracker'; then
            echo "TRACKER missing 'Webmonitor tracker' banner — wrong file?"
            head -1 /tmp/tracker.js
            exit 1
          fi

          echo "Tracker OK: $SIZE bytes, $CT"

          echo ""
          echo "=== /api/tracking/collect (OPTIONS preflight) ==="
          curl -fsS -o /dev/null -w "Status: %{http_code}\n" \
            -X OPTIONS "$CONTAINER_URL/api/tracking/collect" \
            -H "Origin: https://example.com" \
            -H "Access-Control-Request-Method: POST" \
            || (echo "COLLECT OPTIONS FAILED"; exit 1)

          echo ""
          echo "=== /api/tracking/collect (POST without token = 401) ==="
          # Реалистичный негативный тест — несуществующий siteToken должен 401.
          # Используем -f с allow http_error — иначе curl exit non-zero.
          COLLECT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$CONTAINER_URL/api/tracking/collect" \
            -H "Content-Type: application/json" \
            -d '{"sessionToken":"00000000-0000-4000-8000-000000000000",
                 "siteToken":"definitely-not-a-real-token",
                 "packetIndex":0,"isFinal":false,"events":[],
                 "pageUrl":"https://x/","userAgent":"smoke",
                 "startedAt":1700000000000}')
          if [ "$COLLECT_STATUS" != "401" ]; then
            echo "COLLECT POST expected 401, got $COLLECT_STATUS"
            exit 1
          fi
          echo "Collect 401 on unknown token: OK"

          echo ""
          echo "✅ All smoke tests passed"
