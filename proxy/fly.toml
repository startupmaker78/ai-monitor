# fly.toml app configuration file generated for webmon-ai-proxy on 2026-08-05T00:21:56+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'webmon-ai-proxy'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1

  # Health-чек: Fly бьёт /healthz на каждой машине и убирает нездоровую из
  # ротации LB (чтобы не слать трафик в машину с зависшим Caddy).
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
